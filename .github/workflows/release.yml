name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deb:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Debian package
        run: |
          mkdir -p out
          bash scripts/build-debian.sh -o out
          v="$(dpkg-deb -f out/ais-catcher.deb Version)"
          a="$(dpkg-deb -f out/ais-catcher.deb Architecture)"
          mv out/ais-catcher.deb "out/ais-catcher_${v}_${a}.deb"
          ls -la out/

      - name: Smoke test
        run: |
          sudo apt-get install -y ./out/ais-catcher_*.deb
          /usr/bin/AIS-catcher -h build

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: out/ais-catcher_*.deb
